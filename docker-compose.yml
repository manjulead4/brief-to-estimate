services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]        # copy .env.example to .env; leave LLM_PROVIDER=none to run offline
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
